# Render Blueprint: New > Blueprint > pick this repo. See DEPLOYMENT.md.
services:
  - type: web
    name: tixgh-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PLATFORM_NAME
        value: TixGH
      - key: DATABASE_URL          # Neon connection string
        sync: false
      - key: CLOUDINARY_URL        # cloudinary://key:secret@cloud_name
        sync: false
      - key: FRONTEND_URL          # your Vercel URL, e.g. https://tixgh.vercel.app
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # same Vercel URL
        sync: false
      - key: PAYMENT_GATEWAY
        value: paystack
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: SMS_BACKEND           # console = codes appear in Render logs (until an SMS provider is set up)
        value: console
      - key: SEED_DEMO
        value: "true"
